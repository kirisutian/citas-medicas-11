spring.application.name=auth

server.port=${PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# create-drop: crea las tablas al arrancar y las borra al apagar. Solo para aprender.
spring.jpa.hibernate.ddl-auto=create-drop

# --- Propiedades propias del proyecto (el código las lee con @Value) ---

# JWT de /api/login: quién emite el token y cuánto dura (en segundos)
auth.jwt.issuer=http://localhost:${PORT}
auth.jwt.expiration-seconds=3600

# CORS: orígenes permitidos, separados por coma (Angular en desarrollo)
auth.cors.allowed-origins=http://localhost:4200